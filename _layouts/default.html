<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icons/matcha_latte.png">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- MathJax v3: Kramdown with math_engine: mathjax outputs <script type="math/tex"> -->
  <script>
    MathJax = {
      tex: {
        processEscapes: true
      },
      startup: {
        ready() {
          MathJax.startup.defaultReady();
          // Convert Kramdown's <script type="math/tex"> to MathJax v3 math items
          document.querySelectorAll('script[type^="math/tex"]').forEach(function(node) {
            var display = !!node.type.match(/;\s*mode=display/);
            var math = new MathJax.startup.document.options.MathItem(
              node.textContent,
              MathJax.startup.document.inputJax[0],
              display
            );
            var text = document.createTextNode('');
            node.parentNode.replaceChild(text, node);
            math.start = {node: text, delim: '', n: 0};
            math.end = {node: text, delim: '', n: 0};
            MathJax.startup.document.math.push(math);
          });
          MathJax.startup.document.clear();
          MathJax.startup.document.updateDocument();
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body>
  {% include header.html %}

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
</body>
</html>
